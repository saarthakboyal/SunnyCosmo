<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, shrink-to-fit=no"
  />

  <meta name="theme-color" content="#000000" />

  <!-- Primary SEO -->
  <title>Sunny Cosmo | Official Website</title>

  <meta
    name="description"
    content="Official website of Sunny Cosmo — music for the hopeless romantics. Stream Intangible and discover the world of Sunny Cosmo."
  />

  <meta
    name="keywords"
    content="Sunny Cosmo, Sunny Cosmo music, Sunny Cosmo official, Sunny Cosmo songs, Intangible Sunny Cosmo, Sunny Cosmo lyric video, indie pop artist, melancholic indie pop, hopeless romantic music, romantic indie artist"
  />

  <meta name="author" content="Sunny Cosmo" />
  <meta name="robots" content="index, follow" />

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/png"
    href="%PUBLIC_URL%/favicon.png"
  />

  <link
    rel="apple-touch-icon"
    href="%PUBLIC_URL%/favicon.png"
  />

  <!-- Manifest -->
  <link
    rel="manifest"
    href="%PUBLIC_URL%/manifest.json"
  />

  <!-- Open Graph (Social Sharing) -->
  <meta
    property="og:type"
    content="website"
  />

  <meta
    property="og:title"
    content="Sunny Cosmo | Official Website"
  />

  <meta
    property="og:description"
    content="Music for the hopeless romantics."
  />

  <meta
    property="og:image"
    content="%PUBLIC_URL%/seo-image.png"
  />

  <meta
    property="og:site_name"
    content="Sunny Cosmo"
  />

  <!-- Twitter / X Preview -->
  <meta
    name="twitter:card"
    content="summary_large_image"
  />

  <meta
    name="twitter:title"
    content="Sunny Cosmo | Official Website"
  />

  <meta
    name="twitter:description"
    content="Music for the hopeless romantics."
  />

  <meta
    name="twitter:image"
    content="%PUBLIC_URL%/seo-image.png"
  />

</head>

<body>
  <noscript>
    You need to enable JavaScript to run this app.
  </noscript>

  <div id="root"></div>
</body>

</html>
